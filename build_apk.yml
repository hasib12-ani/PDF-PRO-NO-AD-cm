name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'

      - name: Build Release APK with Auto-Path Detection
        run: |
          # ফোল্ডারে pubspec.yaml বা main.dart খুঁজতে সমস্যা হলে এটি নিজে থেকেই সঠিক পথ খুঁজে নেবে
          if [ ! -f "pubspec.yaml" ]; then
            PROJ_DIR=$(find . -name "pubspec.yaml" -not -path '*/.*' -exec dirname {} \; | head -n 1)
            if [ -n "$PROJ_DIR" ]; then
              echo "Found project in: $PROJ_DIR"
              cd "$PROJ_DIR"
            fi
          fi
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Pro-No-Ad-Release-APK
          path: '**/app-release.apk'
          
